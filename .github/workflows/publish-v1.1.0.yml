name: Publish Soldie v1.1.0

on:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-v1.1.0.yml']

jobs:
  release:
    if: github.repository == 'CanisLegatus/Soldie'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create v1.1.0 --target "$GITHUB_SHA" --title 'Soldie v1.1.0' --notes 'В отчёте «К собранию» добавлена колонка «Похожие» из Vision, уточнено название «Моя LFL» и добавлены стрелки сравнения и кубки лидеров. Обновлена вёрстка для печати на A4.'
