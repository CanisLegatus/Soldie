name: Publish Soldie release

on:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-release.yml']

jobs:
  tests:
    uses: ./.github/workflows/check-dashboards.yml
  release:
    needs: tests
    if: github.repository == 'CanisLegatus/Soldie'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: v1.1.3
        run: |
          gh release create "$RELEASE_TAG" --target "$GITHUB_SHA" --title "Soldie $RELEASE_TAG" --notes 'В сравнении участвуют все 305 магазинов. Расходящиеся значения чеков из двух выгрузок подписаны в отчёте. Перед выпуском месячный и недельный отчёты сверяются с исходными выгрузками.'
