name: Publish Soldie release

on:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-release.yml']

jobs:
  tests:
    uses: ./.github/workflows/check-dashboards.yml
  release:
    needs: tests
    if: github.repository == 'CanisLegatus/Soldie'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: v1.3.0
        run: |
          gh release create "$RELEASE_TAG" --target "$GITHUB_SHA" --title "Soldie $RELEASE_TAG" --notes-file - <<'NOTES'
          ## План на сегодня и два макета A4

          Откройте **Обзор → Ежедневный брифинг** и выберите книжную или альбомную ориентацию. Оба макета можно просмотреть, распечатать и сохранить в PDF на одном листе A4.

          - Вверху отчёта показаны цели дня по обороту и чекам. Рядом видны факт, остаток и требуемый средний чек, когда доступны данные.
          - Вместо блока отделов — графики дневного плана и факта по обороту и чекам. На графиках выделена отчётная дата.
          - Месячные карточки выделяют прогноз, а рядом с прогнозом ТО показаны место по РФ и сравнение с сетью и регионом.
          NOTES
