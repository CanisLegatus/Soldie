name: Publish Soldie release

on:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-release.yml']

jobs:
  release:
    if: github.repository == 'CanisLegatus/Soldie'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: v1.1.2
        run: |
          gh release create "$RELEASE_TAG" --target "$GITHUB_SHA" --title "Soldie $RELEASE_TAG" --notes 'Импорт «План-Факта» читает план, факт и прогноз, когда название магазина указано один раз на весь блок. Прогноз чеков проверен во всех пяти колонках отчёта «К собранию» на исходных выгрузках за 22.11.2026.'
