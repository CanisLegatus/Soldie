name: Publish Soldie release

on:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-release.yml']

jobs:
  tests:
    uses: ./.github/workflows/check-dashboards.yml
  release:
    needs: tests
    if: github.repository == 'CanisLegatus/Soldie'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: v1.2.0
        run: |
          gh release create "$RELEASE_TAG" --target "$GITHUB_SHA" --title "Soldie $RELEASE_TAG" --notes-file - <<'NOTES'
          ## Ежедневный брифинг магазина

          В меню **Обзор → Ежедневный брифинг** выберите магазин, отчётную дату и период. Soldie соберёт из загруженных отчётов выполнение месячного плана, KPI, 3SKU, задачи на день и результаты отделов.

          - **Предпросмотр A4**, печать и сохранение PDF через системный диалог.
          - Прогноз и отклонение по календарю планов. Требуемый средний чек рассчитывается на оставшиеся чеки.
          - Настраиваемые пороги KPI и порядок отделов. Отчёт показывает пропуски и расхождения в источниках.
          NOTES
