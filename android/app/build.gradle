plugins {
    id 'com.android.application'
}

android {
    namespace 'ru.galamart.markdownmanager'
    compileSdk 35

    defaultConfig {
        applicationId 'ru.galamart.markdownmanager'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '1.0.0'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// Keep the WebView assets identical to the offline web source for every APK build.
tasks.register('syncWebAssets', Sync) {
    from(rootProject.file('galamart-analyst'))
    into(layout.projectDirectory.dir('src/main/assets/www'))
}
tasks.named('preBuild').configure {
    dependsOn(tasks.named('syncWebAssets'))
}
